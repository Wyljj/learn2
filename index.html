<h1>职学 岗位培训工作台</h1>
<p>本项目已升级为带服务端账号、审核发布和真实学习记录的本地试用版本。</p>
<h2>开始使用</h2>
<ol><li>安装 Node.js 22 或以上版本。</li><li>下载本仓库，在项目目录双击“启动职学.cmd”，或运行 <code>node server.mjs</code>。</li><li>打开 <a href="http://127.0.0.1:4317">http://127.0.0.1:4317</a>，首次设置培训管理员。</li></ol>
<p>新版需要 Node 服务，GitHub Pages 仅展示这份启动说明。详细使用流程请查阅仓库 README。</p>
<h2>申报材料</h2><p>可编辑的申报准备稿与试用成效记录表位于 <code>output/申报材料</code>。当前待真实试用和单位认定。</p>
